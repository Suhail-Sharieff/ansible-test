- name: install apache2 in group3
  hosts: group3
  become: true
  gather_facts: false
  tasks:
    - name: install apache2 package
      ansible.builtin.apt:
        name: apache2-bin
        state: present
    - name: enable apache2 server
      ansible.builtin.service:
        name: apache2
        enabled: true
    - name: restart apache2
      ansible.builtin.service:
        name: apache2
        state: started
        