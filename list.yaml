# ansible-playbook -i localhost list.yaml
- name: Print fruit names in debug
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fruits:
      - name: apple
        weight: 23
      - name: pineapple
        weight: 34
  tasks:
    - name: Print all fruits name
      ansible.builtin.debug:
        msg:
          My fruits are {{item.name}} and my weight is {{item.weight}} and name data type is {{item.name|type_debug}} & data type is {{item.weight|type_debug}}
      # loop:
      #   - apple
      #   - banane
      #   - pineapple
      loop: "{{fruits}}"
