# run: ansible-playbook -i localhost test.yaml -e some_app_port=xxx
- name: Suhail Play
  hosts: localhost
  become: true
  vars:
    app_port: "{{some_app_port|mandatory}}"
  tasks:
    - name: Simple tasks
      ansible.builtin.file:
        state: touch
        mode: "440"
        owner: suhail
        group: suhail
        path: "{{ item.path }}"
      loop:
        - path: ./a.txt
    - name: Copy content
      ansible.builtin.copy:
        mode: "0644"
        dest: ./a.txt
        content:
          Server port={{app_port}}

        
