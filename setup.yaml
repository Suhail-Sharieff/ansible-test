- name: Servers setup
  hosts: webServers
  tasks:
    - name: Install apache2
      ansible.builtin.apt:
        name: apache2
        state: present
    - name: Enable apache2
      ansible.builtin.service:
        name: apache2
        enabled: true
    - name: Start apache2
      ansible.builtin.service:
        name: apache2
        state: started
